openapi: 3.0.3
info:
  title: Bon Gout API
  version: 1.0.0
  description: >-
    Contratos API-First del Sistema Digital Integral Bon Gout (TP4).
    Fuente de verdad de los 5 endpoints críticos; todo endpoint nuevo se
    especifica aquí antes de implementarse (.opencoderules v3).
servers:
  - url: http://localhost:3001
    description: Desarrollo local (docker compose)
security:
  - bearerAuth: []
paths:
  /api/productos:
    get:
      summary: Listar catálogo de productos
      operationId: listarProductos
      security: []
      responses:
        '200':
          description: Catálogo completo
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Producto'
        '500':
          $ref: '#/components/responses/Error500'
  /api/carrito/{clienteId}/agregar:
    post:
      summary: Agregar un producto al carrito
      operationId: agregarAlCarrito
      security: []
      parameters:
        - $ref: '#/components/parameters/ClienteId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AgregarItem'
      responses:
        '200':
          description: Item agregado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CarritoRespuesta'
        '400':
          $ref: '#/components/responses/Error400'
        '401':
          $ref: '#/components/responses/Error401'
        '500':
          $ref: '#/components/responses/Error500'
  /api/pedidos:
    post:
      summary: Crear un pedido (checkout)
      operationId: crearPedido
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CrearPedido'
      responses:
        '201':
          description: Pedido creado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Pedido'
        '400':
          $ref: '#/components/responses/Error400'
        '401':
          $ref: '#/components/responses/Error401'
        '500':
          $ref: '#/components/responses/Error500'
  /api/pedidos/{id}:
    get:
      summary: Obtener un pedido por id
      operationId: obtenerPedido
      parameters:
        - $ref: '#/components/parameters/PedidoId'
      responses:
        '200':
          description: Pedido encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Pedido'
        '401':
          $ref: '#/components/responses/Error401'
        '404':
          $ref: '#/components/responses/Error404'
        '500':
          $ref: '#/components/responses/Error500'
  /api/pedidos/{id}/estado:
    patch:
      summary: Cambiar el estado de un pedido (admin/empleado)
      operationId: cambiarEstadoPedido
      parameters:
        - $ref: '#/components/parameters/PedidoId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - estado
              properties:
                estado:
                  $ref: '#/components/schemas/EstadoPedido'
      responses:
        '200':
          description: Estado actualizado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Mensaje'
        '400':
          $ref: '#/components/responses/Error400'
        '401':
          $ref: '#/components/responses/Error401'
        '404':
          $ref: '#/components/responses/Error404'
        '500':
          $ref: '#/components/responses/Error500'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: JWT emitido al autenticar usuaria admin/empleado (ADR-001)
  parameters:
    ClienteId:
      name: clienteId
      in: path
      required: true
      schema:
        type: integer
        minimum: 1
    PedidoId:
      name: id
      in: path
      required: true
      schema:
        type: integer
        minimum: 1
  schemas:
    Producto:
      type: object
      required:
        - id
        - nombre
        - precioBase
        - categoria
        - activo
        - stock
      properties:
        id:
          type: integer
        nombre:
          type: string
          maxLength: 100
        descripcion:
          type: string
        precioBase:
          type: number
          minimum: 0
        categoria:
          type: string
        imagen:
          type: string
        activo:
          type: boolean
        stock:
          type: integer
          minimum: 0
    CarritoItem:
      type: object
      required:
        - productoId
        - cantidad
      properties:
        productoId:
          type: integer
        cantidad:
          type: integer
          minimum: 1
        personalizaciones:
          type: string
          maxLength: 280
    AgregarItem:
      allOf:
        - $ref: '#/components/schemas/CarritoItem'
    CarritoRespuesta:
      type: object
      required:
        - message
        - carrito
      properties:
        message:
          type: string
        carrito:
          type: object
          required:
            - items
          properties:
            items:
              type: array
              items:
                $ref: '#/components/schemas/CarritoItem'
    EstadoPedido:
      type: string
      enum:
        - pendiente
        - en_produccion
        - en_entrega
        - entregado
        - cancelado
    Pedido:
      type: object
      required:
        - id
        - clienteId
        - fechaPedido
        - fechaEntrega
        - estado
        - total
      properties:
        id:
          type: integer
        clienteId:
          type: integer
        fechaPedido:
          type: string
          format: date-time
        fechaEntrega:
          type: string
          format: date-time
          description: Mínimo 48h hábiles desde la creación
        estado:
          $ref: '#/components/schemas/EstadoPedido'
        total:
          type: number
          minimum: 0
        observaciones:
          type: string
    CrearPedido:
      type: object
      required:
        - clienteId
        - fechaEntrega
        - metodoPago
        - items
      properties:
        clienteId:
          type: integer
        fechaEntrega:
          type: string
          format: date-time
        metodoPago:
          type: string
          enum:
            - mercadopago
            - transferencia
            - efectivo
        observaciones:
          type: string
          maxLength: 500
        items:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/CarritoItem'
    Mensaje:
      type: object
      required:
        - message
      properties:
        message:
          type: string
    Error:
      type: object
      required:
        - error
      properties:
        error:
          type: string
  responses:
    Error400:
      description: Solicitud inválida (campos faltantes, stock insuficiente, fecha < 48h)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Error401:
      description: No autenticado (falta JWT o inválido)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Error404:
      description: Recurso no encontrado
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Error500:
      description: Error interno del servidor
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
