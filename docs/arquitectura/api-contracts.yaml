openapi: 3.0.3
info:
  title: Bon Gout API
  version: 1.0.0
  description: >-
    Contratos API-First del Sistema Digital Integral Bon Gout (TP4).
    Fuente de verdad de los 5 endpoints críticos; todo endpoint nuevo se
    especifica aquí antes de implementarse (.opencoderules v3).
servers:
  - url: http://localhost:3001
    description: Desarrollo local (docker compose)
security:
  - bearerAuth: []
paths:
  /api/productos:
    get:
      summary: Listar catálogo de productos
      operationId: listarProductos
      security: []
      responses:
        '200':
          description: Catálogo completo
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Producto'
        '500':
          $ref: '#/components/responses/Error500'
  /api/carrito/{clienteId}/agregar:
    post:
      summary: Agregar un producto al carrito
      operationId: agregarAlCarrito
      security: []
      parameters:
        - $ref: '#/components/parameters/ClienteId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AgregarItem'
      responses:
        '200':
          description: Item agregado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CarritoRespuesta'
        '400':
          $ref: '#/components/responses/Error400'
        '401':
          $ref: '#/components/responses/Error401'
        '500':
          $ref: '#/components/responses/Error500'
  /api/pedidos:
    post:
      summary: Crear un pedido (checkout)
      operationId: crearPedido
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CrearPedido'
      responses:
        '201':
          description: Pedido creado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Pedido'
        '400':
          $ref: '#/components/responses/Error400'
        '401':
          $ref: '#/components/responses/Error401'
        '500':
          $ref: '#/components/responses/Error500'
  /api/pedidos/{id}:
    get:
      summary: Obtener un pedido por id
      operationId: obtenerPedido
      parameters:
        - $ref: '#/components/parameters/PedidoId'
      responses:
        '200':
          description: Pedido encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Pedido'
        '401':
          $ref: '#/components/responses/Error401'
        '404':
          $ref: '#/components/responses/Error404'
        '500':
          $ref: '#/components/responses/Error500'
  /api/pedidos/{id}/estado:
    patch:
      summary: Cambiar el estado de un pedido (admin/empleado)
      operationId: cambiarEstadoPedido
      parameters:
        - $ref: '#/components/parameters/PedidoId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - estado
              properties:
                estado:
                  $ref: '#/components/schemas/EstadoPedido'
      responses:
        '200':
          description: Estado actualizado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Mensaje'
        '400':
          $ref: '#/components/responses/Error400'
        '401':
          $ref: '#/components/responses/Error401'
        '404':
          $ref: '#/components/responses/Error404'
        '500':
          $ref: '#/components/responses/Error500'
  /api/pedidos/{id}/pagos:
    post:
      summary: Crear un pago para un pedido (sandbox)
      operationId: crearPago
      parameters:
        - $ref: '#/components/parameters/PedidoId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CrearPago'
      responses:
        '201':
          description: Pago creado en estado pendiente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Pago'
        '400':
          $ref: '#/components/responses/Error400'
        '401':
          $ref: '#/components/responses/Error401'
        '404':
          $ref: '#/components/responses/Error404'
        '500':
          $ref: '#/components/responses/Error500'
  /api/pagos/{id}/confirmar:
    post:
      summary: Confirmar o rechazar un pago (solo admin)
      operationId: confirmarPago
      parameters:
        - $ref: '#/components/parameters/PagoId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConfirmarPago'
      responses:
        '200':
          description: Pago actualizado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Pago'
        '400':
          $ref: '#/components/responses/Error400'
        '401':
          $ref: '#/components/responses/Error401'
        '403':
          $ref: '#/components/responses/Error403'
        '404':
          $ref: '#/components/responses/Error404'
        '500':
          $ref: '#/components/responses/Error500'
  /api/pedidos/{id}/testimonios:
    post:
      summary: Crear un testimonio sobre un pedido entregado
      operationId: crearTestimonio
      parameters:
        - $ref: '#/components/parameters/PedidoId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CrearTestimonio'
      responses:
        '201':
          description: Testimonio creado, pendiente de moderación
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Testimonio'
        '400':
          $ref: '#/components/responses/Error400'
        '401':
          $ref: '#/components/responses/Error401'
        '404':
          $ref: '#/components/responses/Error404'
        '500':
          $ref: '#/components/responses/Error500'
  /api/testimonios:
    get:
      summary: Listar testimonios aprobados (público)
      operationId: listarTestimonios
      security: []
      responses:
        '200':
          description: Testimonios aprobados
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Testimonio'
        '500':
          $ref: '#/components/responses/Error500'
  /api/testimonios/{id}:
    patch:
      summary: Aprobar o rechazar un testimonio (solo admin)
      operationId: moderarTestimonio
      parameters:
        - $ref: '#/components/parameters/TestimonioId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ModerarTestimonio'
      responses:
        '200':
          description: Testimonio moderado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Testimonio'
        '400':
          $ref: '#/components/responses/Error400'
        '401':
          $ref: '#/components/responses/Error401'
        '403':
          $ref: '#/components/responses/Error403'
        '404':
          $ref: '#/components/responses/Error404'
        '500':
          $ref: '#/components/responses/Error500'
  /api/inventario:
    get:
      summary: Listar inventario de ingredientes (admin/empleado)
      operationId: listarInventario
      parameters:
        - name: soloAlertas
          in: query
          required: false
          description: Si es true, devuelve solo los ingredientes bajo el punto de reorden
          schema:
            type: boolean
            default: false
      responses:
        '200':
          description: Inventario actual
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/InventarioItem'
        '401':
          $ref: '#/components/responses/Error401'
        '403':
          $ref: '#/components/responses/Error403'
        '500':
          $ref: '#/components/responses/Error500'
  /api/dashboard/metricas:
    get:
      summary: Obtener métricas del negocio (solo admin)
      operationId: obtenerMetricas
      responses:
        '200':
          description: Métricas de ventas, pedidos por estado y alertas de inventario
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MetricasDashboard'
        '401':
          $ref: '#/components/responses/Error401'
        '403':
          $ref: '#/components/responses/Error403'
        '500':
          $ref: '#/components/responses/Error500'
  /api/inventario/{id}/movimientos:
    post:
      summary: Registrar entrada, salida o ajuste de stock (admin/empleado)
      operationId: registrarMovimiento
      parameters:
        - $ref: '#/components/parameters/InventarioId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CrearMovimiento'
      responses:
        '201':
          description: Movimiento registrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MovimientoInventario'
        '400':
          $ref: '#/components/responses/Error400'
        '401':
          $ref: '#/components/responses/Error401'
        '403':
          $ref: '#/components/responses/Error403'
        '404':
          $ref: '#/components/responses/Error404'
        '500':
          $ref: '#/components/responses/Error500'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: JWT emitido al autenticar usuaria admin/empleado (ADR-001)
  parameters:
    ClienteId:
      name: clienteId
      in: path
      required: true
      schema:
        type: integer
        minimum: 1
    PedidoId:
      name: id
      in: path
      required: true
      schema:
        type: integer
        minimum: 1
    InventarioId:
      name: id
      in: path
      required: true
      schema:
        type: integer
        minimum: 1
    PagoId:
      name: id
      in: path
      required: true
      schema:
        type: integer
        minimum: 1
    TestimonioId:
      name: id
      in: path
      required: true
      schema:
        type: integer
        minimum: 1
  schemas:
    Producto:
      type: object
      required:
        - id
        - nombre
        - precioBase
        - categoria
        - activo
        - stock
      properties:
        id:
          type: integer
        nombre:
          type: string
          maxLength: 100
        descripcion:
          type: string
        precioBase:
          type: number
          minimum: 0
        categoria:
          type: string
        imagen:
          type: string
        activo:
          type: boolean
        stock:
          type: integer
          minimum: 0
    CarritoItem:
      type: object
      required:
        - productoId
        - cantidad
      properties:
        productoId:
          type: integer
        cantidad:
          type: integer
          minimum: 1
        personalizaciones:
          type: string
          maxLength: 280
    AgregarItem:
      allOf:
        - $ref: '#/components/schemas/CarritoItem'
    CarritoRespuesta:
      type: object
      required:
        - message
        - carrito
      properties:
        message:
          type: string
        carrito:
          type: object
          required:
            - items
          properties:
            items:
              type: array
              items:
                $ref: '#/components/schemas/CarritoItem'
    EstadoPedido:
      type: string
      enum:
        - pendiente
        - en_produccion
        - en_entrega
        - entregado
        - cancelado
    Pedido:
      type: object
      required:
        - id
        - clienteId
        - fechaPedido
        - fechaEntrega
        - estado
        - total
      properties:
        id:
          type: integer
        clienteId:
          type: integer
        fechaPedido:
          type: string
          format: date-time
        fechaEntrega:
          type: string
          format: date-time
          description: Mínimo 48h hábiles desde la creación
        estado:
          $ref: '#/components/schemas/EstadoPedido'
        total:
          type: number
          minimum: 0
        observaciones:
          type: string
    CrearPedido:
      type: object
      required:
        - clienteId
        - fechaEntrega
        - metodoPago
        - items
      properties:
        clienteId:
          type: integer
        fechaEntrega:
          type: string
          format: date-time
        metodoPago:
          type: string
          enum:
            - mercadopago
            - transferencia
            - efectivo
        observaciones:
          type: string
          maxLength: 500
        items:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/CarritoItem'
    Mensaje:
      type: object
      required:
        - message
      properties:
        message:
          type: string
    InventarioItem:
      type: object
      required:
        - id
        - nombreIngrediente
        - cantidadDisponible
        - unidadMedida
        - puntoReorden
        - requiereReposicion
      properties:
        id:
          type: integer
        nombreIngrediente:
          type: string
          maxLength: 100
        cantidadDisponible:
          type: number
          minimum: 0
        unidadMedida:
          type: string
          maxLength: 20
        puntoReorden:
          type: number
          minimum: 0
        requiereReposicion:
          type: boolean
          description: true cuando cantidadDisponible <= puntoReorden
    MovimientoInventario:
      type: object
      required:
        - id
        - inventarioId
        - tipo
        - cantidad
        - motivo
        - creadoEn
      properties:
        id:
          type: integer
        inventarioId:
          type: integer
        tipo:
          type: string
          enum:
            - entrada
            - salida
            - ajuste
        cantidad:
          type: number
          minimum: 0
        motivo:
          type: string
          maxLength: 200
        pedidoId:
          type: integer
          nullable: true
        creadoEn:
          type: string
          format: date-time
    CrearMovimiento:
      type: object
      required:
        - tipo
        - cantidad
        - motivo
      properties:
        tipo:
          type: string
          enum:
            - entrada
            - salida
            - ajuste
        cantidad:
          type: number
          minimum: 0
        motivo:
          type: string
          maxLength: 200
        pedidoId:
          type: integer
          nullable: true
    Pago:
      type: object
      required:
        - id
        - pedidoId
        - metodo
        - estado
        - monto
        - creadoEn
      properties:
        id:
          type: integer
        pedidoId:
          type: integer
        metodo:
          type: string
          enum:
            - mercadopago
            - transferencia
        estado:
          type: string
          enum:
            - pendiente
            - aprobado
            - rechazado
            - reembolsado
        monto:
          type: number
          minimum: 0
        referenciaExterna:
          type: string
          nullable: true
          maxLength: 100
        creadoEn:
          type: string
          format: date-time
    CrearPago:
      type: object
      required:
        - metodo
      properties:
        metodo:
          type: string
          enum:
            - mercadopago
            - transferencia
        referenciaComprobante:
          type: string
          maxLength: 100
          description: Obligatorio para transferencia (n.º de comprobante)
    ConfirmarPago:
      type: object
      required:
        - aprobado
      properties:
        aprobado:
          type: boolean
        motivo:
          type: string
          maxLength: 200
    Testimonio:
      type: object
      required:
        - id
        - clienteId
        - pedidoId
        - comentario
        - calificacion
        - estado
      properties:
        id:
          type: integer
        clienteId:
          type: integer
        pedidoId:
          type: integer
        comentario:
          type: string
          maxLength: 500
        calificacion:
          type: integer
          minimum: 1
          maximum: 5
        estado:
          type: string
          enum:
            - pendiente
            - aprobado
            - rechazado
        creadoEn:
          type: string
          format: date-time
    CrearTestimonio:
      type: object
      required:
        - comentario
        - calificacion
      properties:
        comentario:
          type: string
          minLength: 5
          maxLength: 500
        calificacion:
          type: integer
          minimum: 1
          maximum: 5
    ModerarTestimonio:
      type: object
      required:
        - estado
      properties:
        estado:
          type: string
          enum:
            - aprobado
            - rechazado
    MetricasDashboard:
      type: object
      required:
        - ventas
        - pedidosPorEstado
        - alertasInventario
        - totalPedidos
      properties:
        ventas:
          type: object
          required:
            - dia
            - semana
            - mes
          properties:
            dia:
              type: number
              minimum: 0
            semana:
              type: number
              minimum: 0
            mes:
              type: number
              minimum: 0
        pedidosPorEstado:
          type: object
          required:
            - pendiente
            - en_produccion
            - en_entrega
            - entregado
            - cancelado
          properties:
            pendiente:
              type: integer
              minimum: 0
            en_produccion:
              type: integer
              minimum: 0
            en_entrega:
              type: integer
              minimum: 0
            entregado:
              type: integer
              minimum: 0
            cancelado:
              type: integer
              minimum: 0
        alertasInventario:
          type: array
          items:
            type: object
            required:
              - id
              - nombreIngrediente
              - cantidadDisponible
              - unidadMedida
              - puntoReorden
            properties:
              id:
                type: integer
              nombreIngrediente:
                type: string
              cantidadDisponible:
                type: number
              unidadMedida:
                type: string
              puntoReorden:
                type: number
        totalPedidos:
          type: integer
          minimum: 0
    Error:
      type: object
      required:
        - error
      properties:
        error:
          type: string
  responses:
    Error400:
      description: Solicitud inválida (campos faltantes, stock insuficiente, fecha < 48h)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Error401:
      description: No autenticado (falta JWT o inválido)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Error403:
      description: Prohibido (rol insuficiente)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Error404:
      description: Recurso no encontrado
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Error500:
      description: Error interno del servidor
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
