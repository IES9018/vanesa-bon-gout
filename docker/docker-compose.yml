version: '3.8'

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: bongout
      POSTGRES_USER: bongout
      POSTGRES_PASSWORD: bongout_secret
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    ports:
      - "3001:3001"
    environment:
      PORT: 3001
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: bongout
      DB_USER: bongout
      DB_PASSWORD: bongout_secret
      JWT_SECRET: cambio-en-produccion
    depends_on:
      - postgres

  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  pgdata:
