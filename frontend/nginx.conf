# Nginx del frontend Bon Gout: estáticos de Vite + fallback SPA.
server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Cache largo para assets hasheados de Vite (/assets/*).
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }

  # Fallback SPA: cualquier ruta no-archivo sirve index.html.
  location / {
    try_files $uri $uri/ /index.html;
  }
}
